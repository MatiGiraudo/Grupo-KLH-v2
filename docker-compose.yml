version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: klh-postgres
    restart: always
    environment:
      POSTGRES_USER: klh_user
      POSTGRES_PASSWORD: klh_password
      POSTGRES_DB: klh_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: klh-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://klh_user:klh_password@db:5432/klh_db
      JWT_SECRET: klh_jwt_secret_token_2026
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: klh-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
